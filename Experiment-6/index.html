<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive SVG Drawing Tool</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --muted: #374151;
      --text: #e5e7eb;
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #020617);
      color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; padding: 24px; min-height: 100vh;
    }
    header { text-align: center; }
    h1 { margin: 0 0 8px; }
    .toolbar {
      width: min(1100px, 95vw);
      background: rgba(17,24,39,0.8);
      border: 1px solid #1f2937;
      border-radius: 14px; padding: 12px;
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
    .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    label { font-size: 12px; }
    select, input, button {
      background: #0b1220; color: var(--text);
      border: 1px solid var(--muted);
      border-radius: 8px; padding: 6px 10px; font-size: 14px;
    }
    button { cursor: pointer; }
    button.primary { border-color: var(--accent); }
    .stage-wrap { width: min(1100px, 95vw); aspect-ratio: 16/9; }
    .stage {
      width: 100%; height: 100%; background: #0b1020;
      border: 1px dashed #334155; border-radius: 16px;
    }
    .hint { font-size: 12px; opacity: 0.75; }
  </style>
</head>
<body>
  <header>
    <h1>Interactive SVG Drawing Tool</h1>
    <div class="hint">Click–drag to draw. Release to finish.</div>
  </header>

  <section class="toolbar">
    <div class="group">
      <label for="tool">Tool</label>
      <select id="tool">
        <option value="rect">Rectangle</option>
        <option value="line">Line</option>
        <option value="ellipse">Ellipse</option>
        <option value="pencil">Pencil</option>
      </select>
    </div>
    <div class="group">
      <label for="stroke">Stroke</label>
      <input id="stroke" type="color" value="#22d3ee" />
      <label for="width">Width</label>
      <input id="width" type="number" min="1" max="20" value="3" />
    </div>
    <div class="group">
      <label for="fill">Fill</label>
      <input id="fill" type="color" value="#000000" />
      <label><input id="noFill" type="checkbox" checked /> No fill</label>
    </div>
    <div class="group">
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
      <button id="download" class="primary">Download SVG</button>
    </div>
  </section>

  <div class="stage-wrap">
    <svg id="canvas" class="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- Link external JS -->
  <script src="script.js"></script>
</body>
</html>
